<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Job Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header id="main-header" class="header-container">
    <div class="logo-area">
      <h1 id="site-title-text"></h1>
    </div>
    <div class="auth-area">
      <a id="signin-btn" href="#" class="btn-signin">Sign in</a>
    </div>
  </header>

  <main class="container">
    <div class="job-card">
      <img id="job-img" src="" alt="Job Banner">
      <h2 id="job-title"></h2>
      <p id="company-name" class="company"></p>
      <p id="job-desc"></p>
      
      <a id="apply-btn" href="#" target="_blank" class="btn-apply"></a>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
